[project]
name = "signalbridge-web"
version = "0.1.0"
description = "Browser chat interface for openFDA pharmacovigilance data. Companion to mcp-server-openfda."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.105.2",
    "mcp>=1.27.2",
    "mcp-server-openfda",
    "streamlit>=1.58.0",
]

[tool.uv.sources]
mcp-server-openfda = { git = "https://github.com/Janiumang/mcp-server-openfda.git" }
