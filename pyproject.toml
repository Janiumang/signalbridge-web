[project]
name = "signalbridge-web"
version = "0.1.0"
description = "Browser chat interface for openFDA pharmacovigilance data. Companion to mcp-server-openfda."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.105.2",
    "google-auth>=2.40",
    "gspread>=6.2",
    "mcp>=1.27.2,<2",  # mcp 2.x renamed FastMCP and breaks mcp-server-openfda
    "mcp-server-openfda>=0.2.0",
    "streamlit>=1.58.0",
]
